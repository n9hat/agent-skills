<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" width="720" height="150" role="img" aria-labelledby="t d">
<title id="t">How the bridge hands work over through Git</title>
<desc id="d">Machine A runs /bridge-handoff, which writes HANDOVER.md. Git carries it on a bridge branch. /bridge-takeover checks it against the repository, and Machine B carries on in its own workflow.</desc>
<style>
.track{stroke:#2A3643;stroke-width:1.5;stroke-dasharray:3 4}
.box{fill:#111A22;stroke:#2A3643;stroke-width:1.2}
.lbl{font:600 11px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;fill:#B6BFCA}
.sub{font:400 9px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;fill:#88919C}
.cap{font:400 11px Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#E6EDF3;opacity:0}
.title{font:600 10px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;fill:#2DD4BF}
.title2{font:400 10px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;fill:#88919C}
.dot{fill:#2DD4BF;animation:dot 20s linear infinite}
@keyframes dot{
  0%{transform:translateX(0);opacity:0} 2%{transform:translateX(0);opacity:1}
  11.00%{transform:translateX(0.0px);opacity:1} 15.00%{transform:translateX(116.6px);opacity:1} 26.00%{transform:translateX(116.6px);opacity:1} 30.00%{transform:translateX(246.7px);opacity:1} 41.00%{transform:translateX(246.7px);opacity:1} 45.00%{transform:translateX(363.5px);opacity:1} 56.00%{transform:translateX(363.5px);opacity:1} 60.00%{transform:translateX(487.3px);opacity:1} 71.00%{transform:translateX(487.3px);opacity:1} 75.00%{transform:translateX(607.2px);opacity:1} 
  90.00%{transform:translateX(607.2px);opacity:1}
  97.00%,100%{transform:translateX(607.2px);opacity:0}
}

.n0 .box{animation:b0 20s linear infinite}
.n0 .lbl{animation:l0 20s linear infinite}
@keyframes b0{0%,0.00%{stroke:#2A3643} 0.00%,90.00%{stroke:#4ADE80} 97.00%,100%{stroke:#2A3643}}
@keyframes l0{
  0%,0.00%{fill:#B6BFCA;filter:drop-shadow(0 0 0 transparent)}
  0.00%{fill:#E6EDF3;filter:drop-shadow(0 0 5px #4ADE80) drop-shadow(0 0 2px #4ADE80)}
  6.00%,90.00%{fill:#4ADE80;filter:drop-shadow(0 0 0 transparent)}
  97.00%,100%{fill:#B6BFCA;filter:drop-shadow(0 0 0 transparent)}
}
.c0{animation:c0 20s linear infinite}
@keyframes c0{0%,0.00%{opacity:0} 0.50%,14.50%{opacity:1} 15.50%,100%{opacity:0}}
.n1 .box{animation:b1 20s linear infinite}
.n1 .lbl{animation:l1 20s linear infinite}
@keyframes b1{0%,12.00%{stroke:#2A3643} 15.00%,90.00%{stroke:#A78BFA} 97.00%,100%{stroke:#2A3643}}
@keyframes l1{
  0%,12.00%{fill:#B6BFCA;filter:drop-shadow(0 0 0 transparent)}
  15.00%{fill:#E6EDF3;filter:drop-shadow(0 0 5px #A78BFA) drop-shadow(0 0 2px #A78BFA)}
  21.00%,90.00%{fill:#A78BFA;filter:drop-shadow(0 0 0 transparent)}
  97.00%,100%{fill:#B6BFCA;filter:drop-shadow(0 0 0 transparent)}
}
.c1{animation:c1 20s linear infinite}
@keyframes c1{0%,14.50%{opacity:0} 15.50%,29.50%{opacity:1} 30.50%,100%{opacity:0}}
.n2 .box{animation:b2 20s linear infinite}
.n2 .lbl{animation:l2 20s linear infinite}
@keyframes b2{0%,27.00%{stroke:#2A3643} 30.00%,90.00%{stroke:#2DD4BF} 97.00%,100%{stroke:#2A3643}}
@keyframes l2{
  0%,27.00%{fill:#B6BFCA;filter:drop-shadow(0 0 0 transparent)}
  30.00%{fill:#E6EDF3;filter:drop-shadow(0 0 5px #2DD4BF) drop-shadow(0 0 2px #2DD4BF)}
  36.00%,90.00%{fill:#2DD4BF;filter:drop-shadow(0 0 0 transparent)}
  97.00%,100%{fill:#B6BFCA;filter:drop-shadow(0 0 0 transparent)}
}
.c2{animation:c2 20s linear infinite}
@keyframes c2{0%,29.50%{opacity:0} 30.50%,44.50%{opacity:1} 45.50%,100%{opacity:0}}
.n3 .box{animation:b3 20s linear infinite}
.n3 .lbl{animation:l3 20s linear infinite}
@keyframes b3{0%,42.00%{stroke:#2A3643} 45.00%,90.00%{stroke:#4C9AFF} 97.00%,100%{stroke:#2A3643}}
@keyframes l3{
  0%,42.00%{fill:#B6BFCA;filter:drop-shadow(0 0 0 transparent)}
  45.00%{fill:#E6EDF3;filter:drop-shadow(0 0 5px #4C9AFF) drop-shadow(0 0 2px #4C9AFF)}
  51.00%,90.00%{fill:#4C9AFF;filter:drop-shadow(0 0 0 transparent)}
  97.00%,100%{fill:#B6BFCA;filter:drop-shadow(0 0 0 transparent)}
}
.c3{animation:c3 20s linear infinite}
@keyframes c3{0%,44.50%{opacity:0} 45.50%,59.50%{opacity:1} 60.50%,100%{opacity:0}}
.n4 .box{animation:b4 20s linear infinite}
.n4 .lbl{animation:l4 20s linear infinite}
@keyframes b4{0%,57.00%{stroke:#2A3643} 60.00%,90.00%{stroke:#A78BFA} 97.00%,100%{stroke:#2A3643}}
@keyframes l4{
  0%,57.00%{fill:#B6BFCA;filter:drop-shadow(0 0 0 transparent)}
  60.00%{fill:#E6EDF3;filter:drop-shadow(0 0 5px #A78BFA) drop-shadow(0 0 2px #A78BFA)}
  66.00%,90.00%{fill:#A78BFA;filter:drop-shadow(0 0 0 transparent)}
  97.00%,100%{fill:#B6BFCA;filter:drop-shadow(0 0 0 transparent)}
}
.c4{animation:c4 20s linear infinite}
@keyframes c4{0%,59.50%{opacity:0} 60.50%,74.50%{opacity:1} 75.50%,100%{opacity:0}}
.n5 .box{animation:b5 20s linear infinite}
.n5 .lbl{animation:l5 20s linear infinite}
@keyframes b5{0%,72.00%{stroke:#2A3643} 75.00%,90.00%{stroke:#4ADE80} 97.00%,100%{stroke:#2A3643}}
@keyframes l5{
  0%,72.00%{fill:#B6BFCA;filter:drop-shadow(0 0 0 transparent)}
  75.00%{fill:#E6EDF3;filter:drop-shadow(0 0 5px #4ADE80) drop-shadow(0 0 2px #4ADE80)}
  81.00%,90.00%{fill:#4ADE80;filter:drop-shadow(0 0 0 transparent)}
  97.00%,100%{fill:#B6BFCA;filter:drop-shadow(0 0 0 transparent)}
}
.c5{animation:c5 20s linear infinite}
@keyframes c5{0%,74.50%{opacity:0} 75.50%,89.50%{opacity:1} 90.50%,100%{opacity:0}}
.static{opacity:0}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important}
  .dot,.cap{opacity:0} .static{opacity:1}
  .n0 .box{stroke:#4ADE80} .n0 .lbl{fill:#4ADE80} .n1 .box{stroke:#A78BFA} .n1 .lbl{fill:#A78BFA} .n2 .box{stroke:#2DD4BF} .n2 .lbl{fill:#2DD4BF} .n3 .box{stroke:#4C9AFF} .n3 .lbl{fill:#4C9AFF} .n4 .box{stroke:#A78BFA} .n4 .lbl{fill:#A78BFA} .n5 .box{stroke:#4ADE80} .n5 .lbl{fill:#4ADE80} 
}</style>
<rect width="720" height="150" rx="10" fill="#0B0F14" stroke="#2A3643"/>
<text class="title" x="16" y="24">bridge</text>
<text class="title2" x="64" y="24">· hand work over through Git</text>
<line class="track" x1="56.4" y1="100" x2="663.6" y2="100"/>
<circle class="dot" cx="56.4" cy="100" r="4.5"/>
<g class="n0"><rect class="box" x="16.0" y="42" width="80.8" height="46" rx="7"/><text class="lbl" x="56.4" y="62" text-anchor="middle">Machine A</text><text class="sub" x="56.4" y="77" text-anchor="middle">any workflow</text></g>
<g class="n1"><rect class="box" x="115.5" y="42" width="115.0" height="46" rx="7"/><text class="lbl" x="173.0" y="62" text-anchor="middle">/bridge-handoff</text><text class="sub" x="173.0" y="77" text-anchor="middle">writes the context</text></g>
<g class="n2"><rect class="box" x="249.2" y="42" width="107.8" height="46" rx="7"/><text class="lbl" x="303.1" y="62" text-anchor="middle">HANDOVER.md</text><text class="sub" x="303.1" y="77" text-anchor="middle">goal · next steps</text></g>
<g class="n3"><rect class="box" x="375.6" y="42" width="88.6" height="46" rx="7"/><text class="lbl" x="419.9" y="62" text-anchor="middle">push · pull</text><text class="sub" x="419.9" y="77" text-anchor="middle">bridge branch</text></g>
<g class="n4"><rect class="box" x="482.9" y="42" width="121.6" height="46" rx="7"/><text class="lbl" x="543.7" y="62" text-anchor="middle">/bridge-takeover</text><text class="sub" x="543.7" y="77" text-anchor="middle">checks the repo</text></g>
<g class="n5"><rect class="box" x="623.2" y="42" width="80.8" height="46" rx="7"/><text class="lbl" x="663.6" y="62" text-anchor="middle">Machine B</text><text class="sub" x="663.6" y="77" text-anchor="middle">own workflow</text></g>
<text class="cap c0" x="360.0" y="134" text-anchor="middle">Work on a branch, any way you like</text>
<text class="cap c1" x="360.0" y="134" text-anchor="middle">/bridge-handoff writes the context into one file</text>
<text class="cap c2" x="360.0" y="134" text-anchor="middle">Goal, decisions, open questions, next steps</text>
<text class="cap c3" x="360.0" y="134" text-anchor="middle">Git carries it on a short-lived bridge branch</text>
<text class="cap c4" x="360.0" y="134" text-anchor="middle">/bridge-takeover checks it against the repo</text>
<text class="cap c5" x="360.0" y="134" text-anchor="middle">Machine B carries on, in its own workflow</text>
<text class="cap static" x="360.0" y="134" text-anchor="middle">Hand off on one machine, take over on another: the context travels with the branch</text>
</svg>
